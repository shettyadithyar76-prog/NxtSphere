<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="400" height="250" rx="16" fill="url(#aiBg)" />

  <!-- App Window -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="350" height="210" rx="10" fill="#0f172a" stroke="#312e81" stroke-width="1.5" />

    <!-- Window Topbar -->
    <path d="M0,10 C0,4.47 4.47,0 10,0 L340,0 C345.53,0 350,4.47 350,10 L350,30 L0,30 Z" fill="#1e1b4b" />
    <circle cx="16" cy="15" r="4" fill="#ef4444" />
    <circle cx="28" cy="15" r="4" fill="#f59e0b" />
    <circle cx="40" cy="15" r="4" fill="#10b981" />
    <text x="175" y="20" font-family="monospace" font-size="11" fill="#c7d2fe" text-anchor="middle">tinybench // open-weight-benchmarker</text>

    <!-- Top Metric Badges -->
    <g transform="translate(18, 42)">
      <!-- Metric 1: Tokens / sec -->
      <rect x="0" y="0" width="100" height="42" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="10" y="16" font-family="sans-serif" font-size="9" fill="#94a3b8">Throughput</text>
      <text x="10" y="34" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#38bdf8">148 tok/s</text>

      <!-- Metric 2: Latency -->
      <rect x="108" y="0" width="100" height="42" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="118" y="16" font-family="sans-serif" font-size="9" fill="#94a3b8">First-Token Latency</text>
      <text x="118" y="34" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#34d399">12.4 ms</text>

      <!-- Metric 3: Memory Footprint -->
      <rect x="216" y="0" width="98" height="42" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="226" y="16" font-family="sans-serif" font-size="9" fill="#94a3b8">VRAM Allocation</text>
      <text x="226" y="34" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#a78bfa">4.12 GB</text>
    </g>

    <!-- Benchmarking Comparison Graph -->
    <g transform="translate(18, 96)">
      <rect x="0" y="0" width="314" height="100" rx="6" fill="#090d16" stroke="#1e293b" />
      <text x="12" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#e2e8f0">Model Inference Performance (Open-Weight)</text>
      
      <!-- Model 1 (Tinybench optimized) -->
      <text x="12" y="42" font-family="monospace" font-size="9" fill="#c7d2fe">Model-A (Quantized)</text>
      <rect x="135" y="33" width="165" height="12" rx="3" fill="#6366f1" filter="url(#aiGlow)" />
      <text x="268" y="43" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff">98.2%</text>

      <!-- Model 2 -->
      <text x="12" y="64" font-family="monospace" font-size="9" fill="#94a3b8">Model-B (Standard)</text>
      <rect x="135" y="55" width="120" height="12" rx="3" fill="#3b82f6" />
      <text x="225" y="65" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff">74.5%</text>

      <!-- Model 3 -->
      <text x="12" y="86" font-family="monospace" font-size="9" fill="#94a3b8">Model-C (Baseline)</text>
      <rect x="135" y="77" width="85" height="12" rx="3" fill="#334155" />
      <text x="185" y="87" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff">51.0%</text>
    </g>
  </g>
</svg>
