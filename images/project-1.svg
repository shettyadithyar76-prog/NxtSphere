<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="400" height="250" rx="16" fill="url(#cyberBg)" />

  <!-- Grid overlay -->
  <path d="M0,50 L400,50 M0,100 L400,100 M0,150 L400,150 M0,200 L400,200" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />
  <path d="M80,0 L80,250 M160,0 L160,250 M240,0 L240,250 M320,0 L320,250" stroke="#334155" stroke-width="1" stroke-opacity="0.4" />

  <!-- Terminal Window Mockup -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="350" height="210" rx="10" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <path d="M0,10 C0,4.47 4.47,0 10,0 L340,0 C345.53,0 350,4.47 350,10 L350,30 L0,30 Z" fill="#1e293b" />
    <circle cx="16" cy="15" r="4" fill="#ef4444" />
    <circle cx="28" cy="15" r="4" fill="#f59e0b" />
    <circle cx="40" cy="15" r="4" fill="#10b981" />
    <text x="175" y="20" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">injection-dojo // defense-lab</text>

    <!-- Hacktoberfest & Security Badge -->
    <rect x="255" y="38" width="85" height="20" rx="4" fill="#ff7900" opacity="0.9" />
    <text x="297" y="52" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Hacktoberfest</text>

    <!-- Shield / Security Icon -->
    <g transform="translate(20, 48)" filter="url(#cyberGlow)">
      <path d="M25,0 L50,10 L50,30 C50,48 25,60 25,60 C25,60 0,48 0,30 L0,10 Z" fill="url(#shieldGrad)" />
      <!-- Prompt arrow inside shield -->
      <path d="M15,22 L23,30 L15,38 M25,38 L35,38" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Terminal Code / Simulation output -->
    <g transform="translate(85, 48)">
      <text x="0" y="14" font-family="Consolas, monospace" font-size="11" fill="#38bdf8">[TARGET]: LLM Guardrail v2.4</text>
      <text x="0" y="32" font-family="Consolas, monospace" font-size="11" fill="#a5f3fc">&gt; Testing prompt attack vector...</text>
      <text x="0" y="50" font-family="Consolas, monospace" font-size="11" fill="#4ade80">&gt; Status: Injected payload SANITIZED</text>
      <text x="0" y="68" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">&gt; Defense rule: Token Boundary Lock</text>
    </g>

    <!-- Interactive Interactive Defense Nodes -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="310" height="65" rx="6" fill="#131c2e" stroke="#1e293b" />
      
      <!-- Node 1 -->
      <circle cx="35" cy="32" r="14" fill="#1e3a8a" />
      <text x="35" y="37" font-family="sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">⚡</text>
      <text x="60" y="28" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">Attack Simulator</text>
      <text x="60" y="42" font-family="sans-serif" font-size="9" fill="#94a3b8">Active honeypot</text>

      <!-- Connecting line -->
      <line x1="140" y1="32" x2="175" y2="32" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />

      <!-- Node 2 -->
      <circle cx="200" cy="32" r="14" fill="#065f46" />
      <text x="200" y="37" font-family="sans-serif" font-size="11" fill="#34d399" text-anchor="middle">🛡️</text>
      <text x="225" y="28" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">Safety Verifier</text>
      <text x="225" y="42" font-family="sans-serif" font-size="9" fill="#94a3b8">Zero-leak verified</text>
    </g>
  </g>
</svg>
