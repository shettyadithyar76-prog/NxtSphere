<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Base container mimicking blueprint rounded placeholder -->
  <rect x="10" y="10" width="500" height="320" rx="20" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="2" />

  <!-- Code editor / IDE window -->
  <g transform="translate(60, 42)" filter="url(#shadow)">
    <!-- Window frame -->
    <rect x="0" y="0" width="380" height="236" rx="12" fill="url(#codeGrad)" />
    <!-- Header bar -->
    <path d="M0,12 C0,5.37 5.37,0 12,0 L368,0 C374.63,0 380,5.37 380,12 L380,34 L0,34 Z" fill="#1e293b" />
    <!-- Window controls -->
    <circle cx="20" cy="17" r="5" fill="#ef4444" />
    <circle cx="36" cy="17" r="5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="5" fill="#10b981" />
    <text x="190" y="22" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">adithya_shetty.py</text>

    <!-- Syntax highlighted code lines -->
    <text x="24" y="62" font-family="Consolas, monospace" font-size="12" fill="#38bdf8">class</text>
    <text x="68" y="62" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#facc15">EngineeringStudent</text>
    <text x="200" y="62" font-family="Consolas, monospace" font-size="12" fill="#cbd5e1">:</text>

    <text x="44" y="86" font-family="Consolas, monospace" font-size="12" fill="#f472b6">name</text>
    <text x="80" y="86" font-family="Consolas, monospace" font-size="12" fill="#cbd5e1">=</text>
    <text x="96" y="86" font-family="Consolas, monospace" font-size="12" fill="#34d399">"Adithya Shetty"</text>

    <text x="44" y="108" font-family="Consolas, monospace" font-size="12" fill="#f472b6">campus</text>
    <text x="96" y="108" font-family="Consolas, monospace" font-size="12" fill="#cbd5e1">=</text>
    <text x="112" y="108" font-family="Consolas, monospace" font-size="12" fill="#34d399">"NIAT @ ALARD University"</text>

    <text x="44" y="130" font-family="Consolas, monospace" font-size="12" fill="#f472b6">focus</text>
    <text x="90" y="130" font-family="Consolas, monospace" font-size="12" fill="#cbd5e1">=</text>
    <text x="106" y="130" font-family="Consolas, monospace" font-size="12" fill="#34d399">"B.Tech CSE (AI) - 1st Year"</text>

    <text x="44" y="152" font-family="Consolas, monospace" font-size="12" fill="#f472b6">goal</text>
    <text x="82" y="152" font-family="Consolas, monospace" font-size="12" fill="#cbd5e1">=</text>
    <text x="98" y="152" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">"MAANG Software Engineer"</text>

    <text x="44" y="174" font-family="Consolas, monospace" font-size="12" fill="#f472b6">projects</text>
    <text x="108" y="174" font-family="Consolas, monospace" font-size="12" fill="#cbd5e1">=</text>
    <text x="124" y="174" font-family="Consolas, monospace" font-size="12" fill="#818cf8">["Injection Dojo", "Tinybench"]</text>

    <text x="44" y="200" font-family="Consolas, monospace" font-size="12" fill="#38bdf8">def</text>
    <text x="74" y="200" font-family="Consolas, monospace" font-size="12" fill="#60a5fa">innovate</text>
    <text x="135" y="200" font-family="Consolas, monospace" font-size="12" fill="#cbd5e1">(self):</text>
    <text x="64" y="218" font-family="Consolas, monospace" font-size="12" fill="#818cf8">return</text>
    <text x="116" y="218" font-family="Consolas, monospace" font-size="12" fill="#34d399">"Explore, Build, Excel!"</text>
  </g>

  <!-- Floating badge 1: ALARD University NIAT -->
  <g transform="translate(30, 195)" filter="url(#shadow)">
    <rect x="0" y="0" width="135" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" />
    <circle cx="22" cy="21" r="12" fill="#dbeafe" />
    <text x="22" y="26" font-family="sans-serif" font-size="13" fill="#2563eb" text-anchor="middle">🎓</text>
    <text x="40" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">ALARD Univ</text>
  </g>

  <!-- Floating badge 2: MAANG Aspirant -->
  <g transform="translate(355, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="138" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" />
    <circle cx="22" cy="21" r="12" fill="#e0e7ff" />
    <text x="22" y="26" font-family="sans-serif" font-size="13" fill="#4f46e5" text-anchor="middle">🎯</text>
    <text x="40" y="25" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">MAANG Aspirant</text>
  </g>
</svg>
