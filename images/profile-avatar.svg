<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Outer background glow and rings -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="10 12" />
  <circle cx="200" cy="200" r="165" fill="#eff6ff" />
  <circle cx="200" cy="200" r="150" fill="url(#avatarBgGrad)" filter="url(#softGlow)" />

  <!-- Stylized avatar figure -->
  <g transform="translate(0, 10)">
    <!-- Head -->
    <circle cx="200" cy="140" r="52" fill="#ffffff" />
    <!-- Glasses / Modern engineering accent -->
    <rect x="172" y="132" width="22" height="14" rx="4" fill="none" stroke="#2563eb" stroke-width="3" />
    <rect x="206" y="132" width="22" height="14" rx="4" fill="none" stroke="#2563eb" stroke-width="3" />
    <line x1="194" y1="138" x2="206" y2="138" stroke="#2563eb" stroke-width="3" />
    <!-- Hair -->
    <path d="M148,135 C148,95 170,80 200,80 C230,80 252,95 252,135 C244,115 220,105 200,105 C180,105 156,115 148,135 Z" fill="#1e293b" />
    <!-- Friendly smile -->
    <path d="M190,165 Q200,175 210,165" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />

    <!-- Neck -->
    <rect x="190" y="185" width="20" height="25" fill="#f8fafc" />

    <!-- Shoulders and Torso -->
    <path d="M110,290 C110,230 145,205 200,205 C255,205 290,230 290,290 Z" fill="#ffffff" />
    <!-- Hoodie / Collar detail -->
    <path d="M175,205 L200,240 L225,205 Z" fill="#dbeafe" />
    <path d="M185,205 L200,228 L215,205 Z" fill="#2563eb" />
  </g>

  <!-- Tech badge accent -->
  <g transform="translate(260, 260)">
    <circle cx="25" cy="25" r="30" fill="#ffffff" filter="url(#softGlow)" />
    <circle cx="25" cy="25" r="24" fill="#2563eb" />
    <text x="25" y="32" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
